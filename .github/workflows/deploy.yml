name: Deploy AirTGUserBot Production

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/air_tguserbot

jobs:
  release-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify native calls library is committed
        run: |
          git ls-files --error-unmatch slim_libntgcalls.so
          test -s slim_libntgcalls.so

      - name: Get next version
        id: versioning
        run: |
          # Get latest tag or default to v1.27.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.27.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Parse version components
          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)

          # Get commit message to determine bump type
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          if [[ "$COMMIT_MSG" == *"BREAKING CHANGE"* ]] || [[ "$COMMIT_MSG" =~ [a-z]+\!: ]]; then
            echo "Major bump detected"
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$COMMIT_MSG" == *"feat:"* ]]; then
            echo "Minor bump detected"
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            echo "Patch bump detected (default)"
            PATCH=$((PATCH + 1))
          fi
          
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "$NEW_TAG" > ver.txt
          echo "New calculated tag: $NEW_TAG"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a ${{ steps.versioning.outputs.tag }} -m "${{ github.event.head_commit.message }}"
          git push origin ${{ steps.versioning.outputs.tag }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versioning.outputs.tag }}
          build-args: |
            VERSION=${{ steps.versioning.outputs.tag }}

  deploy:
    needs: release-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "prod.yml,ver.txt"
          target: "/bot/marusia/air_tguserbot"

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /bot/marusia/air_tguserbot
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create secret file for ConfigService
            echo "${{ secrets.SERVICE_KEY }}" > .service_key
            # т.к. FROM gcr.io/distroless/cc-debian12:nonroot
            chmod 644 .service_key
            
            # 1. Create .env file for Docker Compose
            echo "DOMAIN=${{ secrets.HOST }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            chmod 600 .env
            
            # 2. Pull from GHCR and tag locally with the name used by prod.yml
            FULL_IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod"
            docker pull $FULL_IMAGE_NAME
            docker tag $FULL_IMAGE_NAME tguserbot:prod
            
            # 3. Restart application
            docker compose -f prod.yml up -d --force-recreate
            docker image prune -f
