name: CI AirTGUserBot

on:
  pull_request:
    branches:
      - master
  push:
    branches-ignore:
      - master

env:
  PORT: 8080

jobs:
  test:
    runs-on: ubuntu-latest
    name: Setup, test, and build project
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify native calls library is committed
        run: |
          git ls-files --error-unmatch slim_libntgcalls.so
          test -s slim_libntgcalls.so

      - name: Build application
        run: go build -trimpath -ldflags="-s -w" ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
